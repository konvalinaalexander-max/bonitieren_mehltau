# Automatische Tests bei jedem Push und jedem Pull Request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Alle Tests (Analyse, Werkstatt, App, Etiketten, Export, Referenzbilder)
        run: npm test
      - name: Einzeldatei der Werkstatt ist aktuell
        run: |
          node werkzeuge/bauen.mjs
          git diff --exit-code -I 'Einzeldatei-Fassung, gebaut am' -- dist/ || {
            echo "dist/analyse-werkstatt.html ist veraltet: bitte 'node werkzeuge/bauen.mjs' ausführen und mit einchecken."; exit 1; }
